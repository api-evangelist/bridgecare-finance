aid: bridgecare-finance
name: BridgeCare Finance
description: >-
  BridgeCare (getbridgecare.com) is an integrated, modular software platform for
  the early care and education (ECE) system. It gives state agencies, cities and
  counties, child care resource and referral organizations (CCR&Rs), nonprofits,
  and school districts one system to run Pre-K program administration, family
  navigation, coordinated eligibility and enrollment, centralized eligibility
  screening, licensing, workforce development, quality management (QRIS), grants
  management, subsidy administration, tri-share administration, and program
  assurance. The platform is used by 500,000+ families, 50,000+ providers, and
  500+ counties. Founded in 2016 and headquartered in San Francisco, BridgeCare
  is backed by Techstars and was surfaced to the API Evangelist network as a
  Techstars portfolio company. BridgeCare operates an API host but publishes no
  public OpenAPI or developer documentation, so this profile is identity-only.
